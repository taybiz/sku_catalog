name: sku_catalog_workspace
description: Workspace root for the sku_catalog packages. Never published.
publish_to: none

environment:
  sdk: ^3.12.0

workspace:
  - packages/sku_catalog
  - packages/sku_catalog_domain
  - packages/sku_catalog_usecases
  - packages/sku_catalog_memory

dev_dependencies:
  melos: ^8.5.0

# Melos configuration lives here, not in melos.yaml: melos 8 reads scripts from
# the workspace root's pubspec. Sibling packages depend on each other by VERSION
# CONSTRAINT, not by path — pub resolves a constraint to the workspace member
# locally, and a published consumer gets the hosted version
# (dart.dev/tools/pub/workspaces).
melos:
  scripts:
    analyze:
      description: Zero-diagnostic check, fatal on infos and warnings.
      exec: dart analyze --fatal-infos --fatal-warnings
    format:
      description: Format every package.
      exec: dart format .
    test:
      description: Run every package's tests.
      exec: dart test
    publish-check:
      description: What pub.dev would see for every package, without publishing.
      exec: dart pub publish --dry-run
    verify:
      description: Everything CI runs, in order.
      run: melos run format && melos run analyze && melos run test && melos run publish-check
