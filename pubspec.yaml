name: sku_catalog
description: >-
  A catalog model for physical parts: SKUs with traits and typed attributes, assemblies of SKUs, manufacturers, places, and the instances that instantiate them.
version: 3.0.0
repository: https://github.com/taybiz/sku_catalog
issue_tracker: https://github.com/taybiz/sku_catalog/issues
topics:
  - catalog
  - sku
  - inventory
  - domain-model
  - traits

environment:
  sdk: '>=3.10.0 <4.0.0'


dependencies:
  equatable: ^3.0.0
  fpdart: ^1.2.0

dev_dependencies:
  coverage: ^1.16.0
  dart_arch_test: ^0.3.1
  lints: ^6.1.0
  melos: ^8.8.0
  shouldly: ^0.5.0+1
  test: ^1.25.0

# Topology C: this single-package repo IS the melos workspace root, so the
# scripts CI calls live here instead of in a melos.yaml (a bad smell since melos
# 7 — see the bible, §2 and §3.3). Run them with `dart run melos run <script>`.
melos:
  useRootAsPackage: true
  scripts:
    format: dart format --output=none --set-exit-if-changed .
    analyze: dart analyze --fatal-infos --fatal-warnings
    test: dart test
    # Line coverage over lib/, with a floor at 90%. The floor is a floor, not a
    # target: it is where a layer that lost its tests fails the build. The suite
    # has run at ~98% since 2.0.0, so the floor is slack most days, and a ratchet
    # chasing the actual number would only red the gate on noise.
    # `--fail-under` is the tool's own check, so the exit code is the gate.
    coverage: dart run coverage:test_with_coverage --fail-under=90
    publish-dry: dart pub publish --dry-run
    # Standard clean: melos-native clean removes generated pub/IDE droppings
    # (.packages, .flutter-plugins*, .dart_tool links) for this workspace.
    clean: dart run melos clean
    # Deep clean: remove every file the repo does not track (logs, build
    # folders, caches, tooling droppings). .gitignore is authoritative, so
    # only untracked-and-unignored files are deleted. Nothing tracked is ever
    # touched by `git clean`.
    clean:deep: git clean -fdx
