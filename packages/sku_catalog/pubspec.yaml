name: sku_catalog
description: >-
  A catalog model for physical parts: SKUs with traits and typed attributes,
  assemblies of SKUs, manufacturers, places, and the devices that instantiate
  them. Re-exports the domain model and its use cases.
version: 0.1.0
repository: https://github.com/taybiz/sku_catalog
issue_tracker: https://github.com/taybiz/sku_catalog/issues
topics:
  - catalog
  - sku
  - inventory
  - domain-model
  - traits
resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  # Sibling packages are depended on by VERSION, not path: pub resolves the
  # constraint to the workspace member locally, and a consumer of the published
  # package gets the hosted version.
  sku_catalog_domain: ^0.1.0
  sku_catalog_usecases: ^0.1.0

dev_dependencies:
  fpdart: ^1.2.0
  lints: ^6.1.0
  sku_catalog_memory: ^0.1.0
  test: ^1.25.0
