name: CI

on:
  # A release is assembled on `release/x.y.z` and lands as one PR, so that branch
  # is gated on every push rather than only at the end: GitHub reads this file
  # from the pushed ref, so adding the pattern here is what turns the gate on for
  # the branch that carries it.
  push:
    branches: [main, 'release/**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      # CI calls the melos scripts, not the raw commands, so a script that rots
      # fails the build instead of quietly passing (bible §3.3, Topology C).
      - name: Format
        run: dart run melos run format
      - name: Analyze
        run: dart run melos run analyze
      - name: Test
        run: dart run melos run test
      # The coverage step re-runs the suite, because the tool collects as it runs.
      # That second pass is the price of the number being enforced rather than
      # claimed — and of a rule that cannot rot quietly.
      - name: Coverage
        run: dart run melos run coverage
      - name: What pub.dev would see
        run: dart run melos run publish-dry
