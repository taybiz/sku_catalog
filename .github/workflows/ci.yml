name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get

      # One script, run exactly as a human runs it: the root package (which
      # melos does not see) first, then every workspace member. A broken script
      # fails the build instead of rotting.
      - name: Verify
        run: dart run melos run verify
      - name: What pub.dev would see
        run: dart run melos run publish-check
