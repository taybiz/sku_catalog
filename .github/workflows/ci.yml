name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - run: dart pub get
      # CI calls the melos scripts, not the raw commands, so a script that rots
      # fails the build instead of quietly passing (bible §3.3, Topology C).
      - name: Format
        run: dart run melos run format
      - name: Analyze
        run: dart run melos run analyze
      - name: Test
        run: dart run melos run test
      - name: What pub.dev would see
        run: dart run melos run publish-dry
