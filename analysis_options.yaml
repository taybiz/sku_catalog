include: package:lints/recommended.yaml

analyzer:
  errors:
    # A TODO on a published package is a decision someone dodged.
    todo: error

# The dependency graph of lib/ is enforced as you type, here and in CI: see
# import_rules.yaml for the rules. No pubspec dependency — the analyzer resolves
# the plugin itself.
plugins:
  import_rules: ^0.0.8

linter:
  rules:
    public_member_api_docs: true
    implementation_imports: true
    # Use cases read `: _repository = repository` deliberately — the parameter
    # name documents the type at the call site, and the field name states the
    # invariant. Same convention as the codebase this was extracted from.
    prefer_initializing_formals: false
