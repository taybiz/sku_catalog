include: package:lints/recommended.yaml

analyzer:
  language:
    # Bible §9.7 / §2 ("Analyzer: zero tolerance"): the strict flags are on, so
    # implicit dynamic and raw types are diagnostics rather than habit.
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # A TODO on a published package is a decision someone dodged (§2.2).
    todo: error

# The dependency graph of lib/ is enforced as you type, here and in CI: see
# import_rules.yaml for the rules. No pubspec dependency — the analyzer resolves
# the plugin itself.
plugins:
  import_rules: ^0.0.8

linter:
  rules:
    public_member_api_docs: true
    implementation_imports: true
