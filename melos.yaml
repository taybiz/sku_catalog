name: sku_catalog
packages:
  - packages/**

scripts:
  analyze:
    description: Zero-diagnostic check, fatal on infos and warnings.
    exec: dart analyze --fatal-infos --fatal-warnings
  format:
    description: Format every package.
    exec: dart format .
  test:
    description: Run every package's tests.
    exec: dart test
  publish-check:
    description: What pub.dev would see, without publishing.
    exec: dart pub publish --dry-run
